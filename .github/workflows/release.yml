name: Release Harpy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build'
        required: true
        default: 'v2.6.4'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create release and publish npm package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check release version
        run: npm run check:version -- --tag "${{ inputs.tag || github.ref_name }}"
      - run: npm run build
      # Distribution is npm-only — the GitHub release exists for release
      # notes and the auto-attached source archives, not binaries.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists — skipping"
          else
            gh release create "$RELEASE_TAG" \
              --title "Harpy $RELEASE_TAG" \
              --notes "Install: \`npm i -g @harpy-run/harpy\`" \
              --generate-notes \
              --latest
          fi
      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          NAME="$(node -p "require('./package.json').name")"
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not configured — skipping npm publish"
            exit 0
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — skipping"
            exit 0
          fi
          npm publish --access public
